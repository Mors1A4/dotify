<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="dotify - Free Spotify clone with open music streams and P2P torrent streaming" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>dotify · Free Music Streaming</title>
    <script>
      // Persistent Background Audio Protection:
      // YouTube Iframe and Web Audio players inspect document.hidden & document.visibilityState
      // to pause playback when phone screen turns off or user switches apps.
      // Override Page Visibility API to report visible and stop visibilitychange events.
      try {
        const fakeVisibility = {
          hidden: { get: () => false, configurable: true },
          visibilityState: { get: () => 'visible', configurable: true },
          webkitHidden: { get: () => false, configurable: true },
          webkitVisibilityState: { get: () => 'visible', configurable: true },
        };
        Object.defineProperties(document, fakeVisibility);
        if (typeof Document !== 'undefined' && Document.prototype) {
          Object.defineProperties(Document.prototype, fakeVisibility);
        }
        window.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);
        document.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-base text-primary overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Completely unregister service workers on local network and clear any stale caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const r of regs) r.unregister();
        });
        if ('caches' in window) {
          caches.keys().then((keys) => {
            for (const k of keys) caches.delete(k);
          });
        }
      }
    </script>
  </body>
